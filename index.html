<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一文斋 · 闲聊 · 电脑技能 · 城市八卦</title>
<style>
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#e8ebf2;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-h:0 4px 12px rgba(16,24,40,.08), 0 16px 40px rgba(16,24,40,.12);
    --radius:16px;
    /* 8 色和谐调色板，每条卡片一个色块 */
    --c1:#6366f1; --c2:#0ea5e9; --c3:#10b981; --c4:#f59e0b;
    --c5:#f43f5e; --c6:#8b5cf6; --c7:#14b8a6; --c8:#ec4899;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 480px at 80% -10%, #e9edff 0%, rgba(233,237,255,0) 60%),
      radial-gradient(900px 420px at -10% 0%, #e6f7ff 0%, rgba(230,247,255,0) 55%),
      var(--bg);
    color:var(--ink);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:0 16px 64px;
  }
  .wrap{max-width:1120px;margin:0 auto;}

  /* ---------- HERO ---------- */
  .hero{
    margin:40px 0 28px;
    padding:40px 40px 34px;
    border-radius:24px;
    color:#fff;
    background:linear-gradient(135deg,#4f46e5 0%, #6366f1 38%, #0ea5e9 100%);
    box-shadow:0 18px 50px rgba(79,70,229,.28);
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;
    background:rgba(255,255,255,.12);border-radius:50%;
  }
  .hero::before{
    content:"";position:absolute;right:80px;bottom:-90px;width:200px;height:200px;
    background:rgba(255,255,255,.08);border-radius:50%;
  }
  .hero h1{font-size:34px;letter-spacing:.5px;font-weight:800;position:relative;}
  .hero p{margin-top:10px;font-size:15.5px;opacity:.92;max-width:720px;position:relative;}
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;position:relative;}
  .tag{
    font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(4px);
  }

  /* ---------- SEARCH ---------- */
  .search{
    position:sticky;top:14px;z-index:5;
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:12px 16px;margin:0 0 30px;
    box-shadow:var(--shadow);
  }
  .search .ic{font-size:18px;opacity:.6;}
  .search input{
    flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink);
  }
  .search input::placeholder{color:#9aa3b2;}
  .search .cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:600;}

  /* ---------- CATEGORY ---------- */
  .cat{margin-bottom:34px;}
  .cat h2{
    display:flex;align-items:center;gap:12px;
    font-size:20px;font-weight:800;margin-bottom:4px;
  }
  .cat h2 .bar{
    width:6px;height:22px;border-radius:3px;flex:none;
    background:linear-gradient(180deg,var(--c1),#818cf8);
  }
  .cat:nth-of-type(2) h2 .bar{background:linear-gradient(180deg,var(--c2),#38bdf8);}
  .cat:nth-of-type(3) h2 .bar{background:linear-gradient(180deg,var(--c3),#34d399);}
  .cat:nth-of-type(4) h2 .bar{background:linear-gradient(180deg,var(--c6),#a78bfa);}
  .cat:nth-of-type(5) h2 .bar{background:linear-gradient(180deg,var(--c4),#fbbf24);}
  .csub{color:var(--muted);font-size:14px;margin:0 0 18px 18px;}

  /* ---------- GRID + CARDS ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px;align-items:stretch;
  }
  .card{
    position:relative;
    display:flex;flex-direction:column;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    text-decoration:none;color:inherit;
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--accent,var(--c1));
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:transparent;}
  .card .top{
    display:flex;align-items:center;gap:14px;margin-bottom:12px;
  }
  /* 每一条的色彩块 */
  .block{
    flex:none;width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;letter-spacing:.3px;
    background:var(--accent,var(--c1));
    box-shadow:0 6px 14px rgba(0,0,0,.12);
  }
  .ctitle{font-size:16.5px;font-weight:700;line-height:1.35;}
  .cmeta{
    font-size:12.5px;font-weight:600;color:var(--accent,var(--c1));
    margin-top:2px;
  }
  .cdesc{font-size:13.5px;color:var(--muted);margin-top:6px;flex:1;}
  .cgo{
    margin-top:14px;font-size:13px;font-weight:700;color:var(--accent,var(--c1));
    display:inline-flex;align-items:center;gap:4px;
  }
  .card:hover .cgo{gap:8px;}

  /* 颜色分配（每条一个色块） */
  .c1{--accent:var(--c1);} .c2{--accent:var(--c2);} .c3{--accent:var(--c3);}
  .c4{--accent:var(--c4);} .c5{--accent:var(--c5);} .c6{--accent:var(--c6);}
  .c7{--accent:var(--c7);} .c8{--accent:var(--c8);}

  .hide{display:none !important;}

  #empty{
    display:none;text-align:center;color:var(--muted);
    padding:40px;font-size:15px;background:var(--panel);
    border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* ---------- FOOTER ---------- */
  footer{
    margin-top:40px;padding:24px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);
    color:var(--muted);font-size:13px;text-align:center;box-shadow:var(--shadow);
  }
  footer b{color:var(--ink);}

  @media (max-width:640px){
    .hero{padding:28px 22px;} .hero h1{font-size:26px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>一文斋</h1>
    <p>闲聊 · 电脑技能 · 城市八卦~</p>
    <div class="tagrow">
      <span class="tag">12 个参数页</span>
      <span class="tag">GVLK 密钥库</span>
      <span class="tag">KMS 激活说明</span>
      <span class="tag">激活案例</span>
      <span class="tag">GitHub Pages 托管</span>
      <span class="tag">自定义域名 ai-chin-a.space</span>
      <span class="tag">最后更新 2026-08-20</span>
    </div>
  </header>

  <div class="search">
    <span class="ic">🔍</span>
    <input id="q" type="text" placeholder="搜索系列 / 架构 / 代号，例如 “E3 v3” 或 “Coffee Lake”" autocomplete="off">
    <span class="cnt" id="cnt"></span>
  </div>

  <noscript>
    <div id="empty" style="display:block">本站主页由 JavaScript 从 <b>pages.json</b> 动态渲染，请开启 JavaScript 以查看全部内容；或直接访问各页面链接。</div>
  </noscript>

  <div id="cats"><!-- 卡片由 pages.json 动态渲染 --></div>

  <div id="empty">没有匹配的参数页，换个关键词试试。</div>

  <footer>
    <b>至强 CPU 参数库</b> · 本站为纯静态站点，由 <b>GitHub Pages</b> 托管，自定义域名 <b>ai-chin-a.space</b>。<br>
    主页条目由 <b>pages.json</b> 单一清单驱动，新增内容只需在清单里加一行；所有参数页均为单文件 HTML（样式内联），可离线打开、可随意转载；数据仅供选型参考，以官方规格书为准。
  </footer>
</div>

<script>
  (function(){
    var catsRoot=document.getElementById('cats');
    var empty=document.getElementById('empty');
    var q=document.getElementById('q');
    var cnt=document.getElementById('cnt');

    function esc(s){
      return String(s==null?'':s).replace(/[&<>"]/g,function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
      });
    }

    function render(data){
      var html='';
      (data.categories||[]).forEach(function(cat){
        html+='<section class="cat" data-cat><h2><span class="bar"></span>'+esc(cat.name)+'</h2>';
        if(cat.sub) html+='<p class="csub">'+esc(cat.sub)+'</p>';
        html+='<div class="grid">';
        (cat.items||[]).forEach(function(it){
          var go=it.go||'查看 →';
          html+='<a class="card '+(it.color||'c1')+'" href="'+esc(it.file)+'">'
              +'<div class="top"><span class="block">'+esc(it.icon||'★')+'</span><div>'
              +'<div class="ctitle">'+esc(it.title)+'</div>'
              +'<div class="cmeta">'+esc(it.meta||'')+'</div></div></div>'
              +'<div class="cdesc">'+esc(it.desc||'')+'</div>'
              +'<span class="cgo">'+esc(go)+'</span></a>';
        });
        html+='</div></section>';
      });
      catsRoot.innerHTML=html;
      update();
    }

    function update(){
      var v=q.value.trim().toLowerCase();
      var total=0,shown=0;
      document.querySelectorAll('[data-cat]').forEach(function(cat){
        var vis=0;
        cat.querySelectorAll('.card').forEach(function(c){
          var show=c.textContent.toLowerCase().indexOf(v)>-1;
          c.classList.toggle('hide',!show);
          if(show){vis++;shown++;}
        });
        cat.classList.toggle('hide',vis===0);
      });
      document.querySelectorAll('.card').forEach(function(){total++;});
      cnt.textContent=v?('匹配 '+shown+' / '+total):'';
      empty.style.display=(v&&shown===0)?'block':'none';
    }

    fetch('pages.json').then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    }).then(render).catch(function(e){
      catsRoot.innerHTML='<div id="empty" style="display:block">主页清单加载失败，请确认 pages.json 存在且为合法 JSON。（'+esc(e.message)+'）</div>';
      console.error(e);
    });

    q.addEventListener('input',update);
  })();
</script>
<script src="assets/js/site-nav.js"></script>
</body>
</html>
